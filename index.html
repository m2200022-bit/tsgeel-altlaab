<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام تسجيل الطلاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#152238;
    --navy-2:#1d3252;
    --teal:#2c8c82;
    --teal-d:#20685f;
    --gold:#c9a227;
    --paper:#f6f4ee;
    --card:#fffdf8;
    --ink:#22303f;
    --muted:#6b7686;
    --line:#e4ddc9;
    --danger:#b8433a;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',sans-serif;
    background:
      repeating-linear-gradient(to bottom, transparent 0px, transparent 34px, rgba(21,34,56,0.045) 35px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    direction:rtl;
  }
  .app{max-width:920px;margin:0 auto;padding:28px 16px 80px;}
  h1,h2,h3{font-family:'Cairo',sans-serif;margin:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;gap:12px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;}
  .seal{
    width:56px;height:56px;border-radius:50%;
    border:2.5px dashed var(--gold);
    display:flex;align-items:center;justify-content:center;
    background:var(--navy);color:#fff;flex-shrink:0;overflow:hidden;
    box-shadow:0 2px 0 rgba(0,0,0,0.08);
  }
  .seal img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .seal .init{font-family:'Cairo',sans-serif;font-weight:800;font-size:20px;}
  .brand-text h1{font-size:20px;color:var(--navy);}
  .brand-text p{margin:2px 0 0;color:var(--muted);font-size:13px;}
  .link-btn{
    background:none;border:none;color:var(--teal-d);font-family:'Tajawal';font-weight:700;
    cursor:pointer;font-size:13px;text-decoration:underline;padding:6px;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 22px;box-shadow:0 1px 3px rgba(21,34,56,0.05), 0 10px 24px -18px rgba(21,34,56,0.4);
    margin-bottom:18px;
  }
  .status-banner{
    display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;
    font-size:13px;font-weight:700;margin-bottom:18px;
  }
  .status-open{background:#e7f4ec;color:#1f7a4a;border:1px solid #bfe3cc;}
  .status-closed{background:#fdecea;color:var(--danger);border:1px solid #f3c9c4;}
  .status-dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex-shrink:0;}
  label{display:block;font-weight:700;font-size:14px;margin-bottom:6px;color:var(--navy-2);}
  .req{color:var(--danger);}
  .field{margin-bottom:18px;}
  input[type=text],input[type=tel],input[type=date],select,textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;
    font-family:'Tajawal';font-size:14.5px;background:#fff;color:var(--ink);
    transition:border-color .15s;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);}
  input[readonly]{background:#f1efe6;color:var(--muted);}
  .hint{font-size:12px;color:var(--muted);margin-top:5px;}
  .radio-row{display:flex;gap:10px;}
  .radio-opt{
    flex:1;border:1.5px solid var(--line);border-radius:9px;padding:10px;text-align:center;
    cursor:pointer;font-weight:700;font-size:14px;color:var(--navy-2);user-select:none;
  }
  .radio-opt.active{border-color:var(--teal);background:#eaf5f3;color:var(--teal-d);}
  .search-wrap{position:relative;}
  .search-list{
    position:absolute;z-index:20;top:calc(100% + 4px);right:0;left:0;
    max-height:220px;overflow-y:auto;background:#fff;border:1.5px solid var(--line);
    border-radius:9px;box-shadow:0 12px 24px -10px rgba(0,0,0,0.25);display:none;
  }
  .search-list.show{display:block;}
  .search-item{padding:9px 12px;cursor:pointer;font-size:14px;}
  .search-item:hover,.search-item.hi{background:#eaf5f3;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--teal);color:#fff;border:none;padding:13px 22px;border-radius:10px;
    font-family:'Cairo';font-weight:700;font-size:15px;cursor:pointer;width:100%;
    transition:background .15s, transform .05s;
  }
  .btn:hover{background:var(--teal-d);}
  .btn:active{transform:scale(.99);}
  .btn.secondary{background:var(--navy);}
  .btn.secondary:hover{background:var(--navy-2);}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
  .btn.danger{background:var(--danger);}
  .btn.small{width:auto;padding:8px 14px;font-size:13px;}
  .success{
    text-align:center;padding:40px 20px;
  }
  .success .stamp{
    width:110px;height:110px;border-radius:50%;border:3px solid var(--gold);
    display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
    color:var(--gold);transform:rotate(-8deg);animation:pop .4s ease-out;
  }
  @keyframes pop{from{transform:rotate(-8deg) scale(.6);opacity:0;}to{transform:rotate(-8deg) scale(1);opacity:1;}}
  .success h2{color:var(--navy);font-size:22px;margin-bottom:10px;}
  .success p{color:var(--muted);font-size:15px;line-height:1.8;}
  .admin-login{max-width:380px;margin:60px auto;}
  .tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:2px solid var(--line);overflow-x:auto;}
  .tab{
    padding:10px 16px;font-family:'Cairo';font-weight:700;font-size:14px;color:var(--muted);
    cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;white-space:nowrap;
  }
  .tab.active{color:var(--teal-d);border-color:var(--teal);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.row2{grid-template-columns:1fr;}}
  .toggle-row{
    display:flex;align-items:center;justify-content:space-between;padding:12px 4px;
    border-bottom:1px solid var(--line);
  }
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .flabel{font-weight:700;font-size:14px;color:var(--navy-2);}
  .switch{position:relative;width:44px;height:24px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:#d7d2c2;border-radius:24px;cursor:pointer;transition:.2s;}
  .slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  input:checked + .slider{background:var(--teal);}
  input:checked + .slider:before{transform:translateX(-20px);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{background:#f1efe6;color:var(--navy-2);font-family:'Cairo';font-size:12.5px;}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
  .empty{text-align:center;color:var(--muted);padding:30px;font-size:14px;}
  .custom-field-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;
  }
  .custom-field-item .cf-info{font-size:13.5px;}
  .cf-info b{display:block;color:var(--navy-2);}
  .cf-info span{color:var(--muted);font-size:12px;}
  .logo-upload{
    display:flex;align-items:center;gap:14px;
  }
  .file-btn{
    border:1.5px dashed var(--line);border-radius:9px;padding:10px 16px;font-size:13px;
    cursor:pointer;color:var(--navy-2);font-weight:700;background:#fff;
  }
  .msg-toast{
    position:fixed;bottom:20px;right:50%;transform:translateX(50%);
    background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;
    font-weight:700;z-index:100;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);
  }
  .err{color:var(--danger);font-size:12.5px;margin-top:5px;font-weight:700;}
  .section-title{font-family:'Cairo';font-weight:800;color:var(--navy);font-size:16px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .muted-note{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.8;}
  .lock-icon{font-size:34px;margin-bottom:8px;}
  .poster-img{width:100%;border-radius:var(--radius);margin-bottom:16px;max-height:280px;object-fit:cover;display:block;border:1px solid var(--line);}
  .age-note{display:flex;align-items:center;gap:6px;background:#fff8e6;border:1px solid #eddcae;color:#8a6d1d;font-size:12.5px;font-weight:700;padding:8px 10px;border-radius:8px;margin-top:8px;}
  .age-note .icon-inline{font-size:16px;}
  .field-icon-label{display:flex;align-items:center;gap:6px;}
  .program-picker{display:grid;gap:12px;}
  .program-card{border:1.5px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.15s;background:#fff;}
  .program-card:hover{border-color:var(--teal);background:#f4faf9;}
  .program-card h3{font-family:'Cairo';color:var(--navy);font-size:16px;margin-bottom:4px;}
  .program-card p{color:var(--muted);font-size:13px;margin:0;}
  .program-select-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .program-select-bar select{width:auto;flex:1;min-width:180px;}
  .program-select-bar label{margin:0;white-space:nowrap;}
  .perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 16px;}
  @media(max-width:560px){.perm-grid{grid-template-columns:1fr;}}
  .perm-chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--navy-2);font-weight:700;background:#f6f4ee;border-radius:8px;padding:8px 10px;}
  .perm-chk input{width:16px;height:16px;}
  .user-row{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .user-row-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .user-name{font-family:'Cairo';font-weight:800;color:var(--navy);font-size:15px;}
  .badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;margin-inline-start:6px;}
  .badge-owner{background:#fbe9c6;color:#8a6416;}
  .badge-off{background:#fdecea;color:var(--danger);}
  .user-perms-list{margin-top:8px;font-size:12px;color:var(--muted);}
  .program-item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;}
  .program-item.active{border-color:var(--teal);background:#eaf5f3;}
  .program-item .pname{font-family:'Cairo';font-weight:800;color:var(--navy);font-size:14.5px;}
  .icon-inline{font-size:15px;}
</style>

<body>
<div id="root" class="app"></div>
<script type="module">
/* ---------------- Firebase (Firestore) ---------------- */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc,
  collection, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSnafBEhlldWiBekq0U5Yd0SrgvcxOdGA",
  authDomain: "tsgeel-cf4cc.firebaseapp.com",
  projectId: "tsgeel-cf4cc",
  storageBucket: "tsgeel-cf4cc.firebasestorage.app",
  messagingSenderId: "870948866985",
  appId: "1:870948866985:web:ad1426c778d0c5ee9ed2b8",
  measurementId: "G-4NHX6S8EZD"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const COL = "app_data"; // every piece of app data (programs / users / each response) is one document in this collection

/* ---------------- Storage helpers (Firestore-backed, same key/value interface as before) ---------------- */
function safeDocId(key){ return key.replace(/\//g, "__"); } // Firestore doc IDs can't contain "/"

async function sget(key, fallback){
  try{
    const snap = await getDoc(doc(db, COL, safeDocId(key)));
    return snap.exists() ? snap.data().value : fallback;
  }catch(e){ console.error(e); return fallback; }
}
async function sset(key, value){
  try{ await setDoc(doc(db, COL, safeDocId(key)), { key, value }); }
  catch(e){ console.error(e); }
}
async function sdel(key){
  try{ await deleteDoc(doc(db, COL, safeDocId(key))); }catch(e){ console.error(e); }
}
async function slist(prefix){
  try{
    const q = query(collection(db, COL), where("key", ">=", prefix), where("key", "<", prefix + "\uf8ff"));
    const snaps = await getDocs(q);
    const keys = [];
    snaps.forEach(s=> keys.push(s.data().key));
    return keys;
  }catch(e){ console.error(e); return []; }
}

const DEFAULT_FIELDS = {
  nationality:true, idNumber:true, birthdate:true, studentPhone:true, guardianPhone:true, disease:true
};

function newId(prefix){ return prefix + Date.now() + Math.random().toString(36).slice(2,7); }

function defaultProgram(name){
  return {
    id: newId('p'),
    name: name || "برنامجنا التدريبي",
    description: "يرجى تعبئة النموذج أدناه لإتمام عملية التسجيل.",
    logo: "",
    poster: "",
    regStart: "",
    regEnd: "",
    thankYouMessage: "تم تسجيلكم بنجاح في برنامج {{program}}. شكرًا لكم!",
    fields: Object.assign({}, DEFAULT_FIELDS),
    customFields: [], // {id,label,type:'text'|'yesno'|'textarea'}
    ageRestrict: false,
    ageFrom: "",
    ageTo: ""
  };
}

const ALL_PERMS = ['programs','schedule','fields','message','responses','users'];
const PERM_LABELS = {
  programs:"إدارة البرامج/الصفوف", schedule:"مواعيد التسجيل", fields:"الأسئلة وعمر المشتركين",
  message:"رسالة الشكر", responses:"عرض/تصدير الاستجابات", users:"إدارة المستخدمين"
};

function defaultOwner(username, password){
  return {
    id: newId('u'),
    username: username || "admin",
    password: password || "admin123",
    active: true,
    isOwner: true,
    permissions: { programs:true, schedule:true, fields:true, message:true, responses:true, users:true }
  };
}

let PROGRAMS = [];
let USERS = [];
let CURRENT_USER = null;

let VIEW = "loading"; // public | adminLogin | admin
let ADMIN_TAB = "programs"; // programs|schedule|fields|message|responses|users
let ADMIN_PROGRAM_ID = null; // currently selected program inside admin panel
let EDIT_PROGRAM_ID = null; // program being edited on the "programs" tab
let SUBMITTED = false;
let SAVING = false;
let PUBLIC_PROGRAM_ID = null; // program chosen by the visitor on the public page

/* ---------------- Nationalities (Arabic) ---------------- */
const NATIONALITIES = ["سعودي","إماراتي","كويتي","قطري","بحريني","عماني","يمني","عراقي","سوري","لبناني","أردني","فلسطيني","مصري","سوداني","ليبي","تونسي","جزائري","مغربي","موريتاني","صومالي","جيبوتي","قمري","تركي","إيراني","أفغاني","باكستاني","هندي","بنغلاديشي","سريلانكي","نيبالي","بوتاني","مالديفي","صيني","ياباني","كوري جنوبي","كوري شمالي","فلبيني","إندونيسي","ماليزي","سنغافوري","تايلاندي","فيتنامي","لاوسي","كمبودي","ميانماري","منغولي","كازاخستاني","أوزبكستاني","تركمانستاني","طاجيكستاني","قيرغيزستاني","أذربيجاني","أرمني","جورجي","روسي","أوكراني","بيلاروسي","مولدوفي","بولندي","تشيكي","سلوفاكي","مجري","روماني","بلغاري","صربي","كرواتي","بوسني","سلوفيني","مقدوني","ألباني","يوناني","قبرصي","مالطي","إيطالي","إسباني","برتغالي","فرنسي","ألماني","سويسري","نمساوي","بلجيكي","هولندي","لوكسمبورغي","بريطاني","إيرلندي","آيسلندي","دنماركي","سويدي","نرويجي","فنلندي","إستوني","لاتفي","ليتواني","أمريكي","كندي","مكسيكي","غواتيمالي","بليزي","هندوراسي","سلفادوري","نيكاراغوي","كوستاريكي","بنمي","كوبي","دومينيكي","هايتي","جامايكي","ترينيدادي","باهامي","بربادوسي","برازيلي","أرجنتيني","تشيلي","بيروفي","كولومبي","فنزويلي","إكوادوري","بوليفي","باراغواياني","أوروغواياني","غياني","سورينامي","جنوب أفريقي","نيجيري","إثيوبي","كيني","تنزاني","أوغندي","غاني","إيفواري","سنغالي","مالي","بوركينابي","نيجري","تشادي","كاميروني","أنغولي","موزمبيقي","زامبي","زيمبابوي","ناميبي","بوتسواني","رواندي","بوروندي","ملاوي","ليسوتو","إسواتيني","مدغشقري","موريشي","سيشيلي","غيني","غيني بيساوي","غيني استوائي","غابوني","كونغولي (برازافيل)","كونغولي (كينشاسا)","أفريقي وسطي","إريتري","جنوب سوداني","ليبيري","سيراليوني","غامبي","رأس أخضر","توغولي","بنيني","أسترالي","نيوزيلندي","فيجي","بابوا غيني الجديدة","ساموا","تونغا"].sort((a,b)=>a.localeCompare(b,'ar'));

/* ---------------- Init ---------------- */
async function init(){
  PROGRAMS = await sget('programs', null);
  USERS = await sget('users', null);

  if(!PROGRAMS){
    // migrate from the old single-program config, if present
    const old = await sget('app-config', null);
    if(old){
      const p = defaultProgram(old.programName);
      p.description = old.programDescription || p.description;
      p.logo = old.logo || "";
      p.regStart = old.regStart || "";
      p.regEnd = old.regEnd || "";
      p.thankYouMessage = old.thankYouMessage || p.thankYouMessage;
      p.fields = Object.assign({}, DEFAULT_FIELDS, old.fields || {});
      p.customFields = old.customFields || [];
      PROGRAMS = [p];
      if(!USERS) USERS = [defaultOwner('admin', old.adminPassword || 'admin123')];
    } else {
      PROGRAMS = [defaultProgram()];
    }
    await sset('programs', PROGRAMS);
  }
  if(!USERS){ USERS = [defaultOwner()]; await sset('users', USERS); }

  ADMIN_PROGRAM_ID = PROGRAMS[0] ? PROGRAMS[0].id : null;
  if(PROGRAMS.length === 1) PUBLIC_PROGRAM_ID = PROGRAMS[0].id;

  VIEW = "public";
  render();
}

function getProgram(id){ return PROGRAMS.find(p=>p.id===id) || null; }

function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function calcAge(dobStr){
  if(!dobStr) return "";
  const dob = new Date(dobStr);
  if(isNaN(dob)) return "";
  const today = new Date();
  let age = today.getFullYear() - dob.getFullYear();
  const m = today.getMonth() - dob.getMonth();
  if(m < 0 || (m===0 && today.getDate() < dob.getDate())) age--;
  return age >= 0 ? age : "";
}

function regStatus(program){
  const now = new Date();
  const start = program.regStart ? new Date(program.regStart) : null;
  const end = program.regEnd ? new Date(program.regEnd) : null;
  if(start && now < start) return {open:false, reason:"لم يبدأ التسجيل بعد", when: fmtDT(start)};
  if(end && now > end) return {open:false, reason:"انتهى وقت التسجيل", when: fmtDT(end)};
  return {open:true};
}

/* birth-year age restriction check: returns true if allowed */
function ageAllowed(program, dobStr){
  if(!program.ageRestrict) return true;
  if(!dobStr) return true;
  const y = new Date(dobStr).getFullYear();
  if(isNaN(y)) return true;
  const from = parseInt(program.ageFrom, 10);
  const to = parseInt(program.ageTo, 10);
  if(!isNaN(from) && y < from) return false;
  if(!isNaN(to) && y > to) return false;
  return true;
}
function fmtDT(d){
  try{ return d.toLocaleString('ar-EG', {dateStyle:'medium', timeStyle:'short'}); }catch(e){ return d.toString(); }
}

/* ---------------- Render root ---------------- */
function render(){
  const root = document.getElementById('root');
  if(VIEW === "loading"){ root.innerHTML = "<p style='text-align:center;padding:60px;color:#6b7686'>جارِ التحميل...</p>"; return; }
  if(VIEW === "adminLogin"){ root.innerHTML = renderAdminLogin(); attachAdminLoginEvents(); return; }
  if(VIEW === "admin"){ root.innerHTML = renderAdmin(); attachAdminEvents(); return; }
  root.innerHTML = renderPublic();
  attachPublicEvents();
}

function renderCustomFieldPublic(cf){
  if(cf.type === 'yesno'){
    return `<div class="field"><label>${esc(cf.label)}</label>
      <div class="radio-row">
        <div class="radio-opt cf-opt" data-cf="${cf.id}" data-val="لا">لا</div>
        <div class="radio-opt cf-opt" data-cf="${cf.id}" data-val="نعم">نعم</div>
      </div>
      <input type="hidden" id="cf_${cf.id}"></div>`;
  }
  if(cf.type === 'textarea'){
    return `<div class="field"><label>${esc(cf.label)}</label><textarea id="cf_${cf.id}" rows="3"></textarea></div>`;
  }
  return `<div class="field"><label>${esc(cf.label)}</label><input type="text" id="cf_${cf.id}"></div>`;
}

function attachPublicEvents(){
  const goAdmin = document.getElementById('goAdmin');
  if(goAdmin) goAdmin.onclick = ()=>{ VIEW="adminLogin"; render(); };

  document.querySelectorAll('.program-card').forEach(el=>{
    el.onclick = ()=>{ PUBLIC_PROGRAM_ID = el.dataset.id; render(); };
  });

  const changeProgram = document.getElementById('changeProgram');
  if(changeProgram) changeProgram.onclick = ()=>{ PUBLIC_PROGRAM_ID = null; SUBMITTED=false; render(); };

  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.onclick = ()=>{ SUBMITTED=false; render(); };

  const program = getProgram(PUBLIC_PROGRAM_ID);
  if(!program) return;

  // nationality search
  const natSearch = document.getElementById('f_nat_search');
  if(natSearch){
    const natList = document.getElementById('natList');
    const showList = (items)=>{
      natList.innerHTML = items.map(n=>`<div class="search-item" data-v="${esc(n)}">${esc(n)}</div>`).join("") || `<div class="search-item" style="color:#999">لا توجد نتائج</div>`;
      natList.classList.add('show');
      natList.querySelectorAll('.search-item[data-v]').forEach(el=>{
        el.onclick = ()=>{ natSearch.value = el.dataset.v; document.getElementById('f_nat_value').value = el.dataset.v; natList.classList.remove('show'); };
      });
    };
    natSearch.addEventListener('focus', ()=> showList(NATIONALITIES));
    natSearch.addEventListener('input', ()=>{
      document.getElementById('f_nat_value').value = "";
      const q = natSearch.value.trim();
      showList(q ? NATIONALITIES.filter(n=>n.includes(q)) : NATIONALITIES);
    });
    document.addEventListener('click', (e)=>{ if(!e.target.closest('.search-wrap')) natList.classList.remove('show'); }, {once:false});
  }

  // dob -> age (+ age-restriction check)
  const dob = document.getElementById('f_dob');
  if(dob) dob.addEventListener('change', ()=>{
    document.getElementById('f_age').value = calcAge(dob.value) + (dob.value ? " سنة" : "");
    const ageErr = document.getElementById('ageErr');
    const submitBtn = document.querySelector('#regForm button[type=submit]');
    if(ageErr){
      const ok = ageAllowed(program, dob.value);
      ageErr.style.display = ok ? "none" : "block";
      if(submitBtn) submitBtn.disabled = !ok;
    }
  });

  // disease yes/no
  const yesBtn = document.getElementById('disease_yes'), noBtn = document.getElementById('disease_no');
  if(yesBtn && noBtn){
    const detailWrap = document.getElementById('diseaseDetailWrap');
    const setVal = (v)=>{
      document.getElementById('f_disease').value = v;
      yesBtn.classList.toggle('active', v==="نعم");
      noBtn.classList.toggle('active', v==="لا");
      detailWrap.style.display = v==="نعم" ? "block" : "none";
    };
    yesBtn.onclick = ()=> setVal("نعم");
    noBtn.onclick = ()=> setVal("لا");
    setVal("لا");
  }

  // custom yes/no fields
  document.querySelectorAll('.cf-opt').forEach(el=>{
    el.onclick = ()=>{
      const cfId = el.dataset.cf, val = el.dataset.val;
      document.getElementById('cf_'+cfId).value = val;
      document.querySelectorAll(`.cf-opt[data-cf="${cfId}"]`).forEach(o=> o.classList.toggle('active', o===el));
    };
  });

  const form = document.getElementById('regForm');
  if(form){
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(SAVING) return;
      // nationality must be picked from list
      if(program.fields.nationality){
        const val = document.getElementById('f_nat_value').value;
        if(!val){ alert("يرجى اختيار الجنسية من القائمة"); return; }
      }
      // age restriction re-check on submit
      if(program.fields.birthdate){
        const dobVal = document.getElementById('f_dob').value;
        if(!ageAllowed(program, dobVal)){
          document.getElementById('ageErr').style.display = "block";
          alert("عذرًا، تاريخ الميلاد المدخل خارج نطاق العمر المسموح به لهذا البرنامج.");
          return;
        }
      }
      SAVING = true;
      const submitBtn = form.querySelector('button[type=submit]');
      submitBtn.textContent = "جارِ الإرسال...";
      submitBtn.disabled = true;

      const resp = {
        id: 'r' + Date.now() + Math.random().toString(36).slice(2,8),
        programId: program.id,
        submittedAt: new Date().toISOString(),
        name: document.getElementById('f_name').value.trim(),
      };
      if(program.fields.nationality) resp.nationality = document.getElementById('f_nat_value').value;
      if(program.fields.idNumber) resp.idNumber = document.getElementById('f_idnum').value.trim();
      if(program.fields.birthdate){
        resp.birthdate = document.getElementById('f_dob').value;
        resp.age = calcAge(resp.birthdate);
      }
      if(program.fields.studentPhone) resp.studentPhone = document.getElementById('f_sphone').value.trim();
      if(program.fields.guardianPhone) resp.guardianPhone = document.getElementById('f_gphone').value.trim();
      if(program.fields.disease){
        resp.disease = document.getElementById('f_disease').value || "لا";
        resp.diseaseDetail = resp.disease === "نعم" ? document.getElementById('f_disease_detail').value.trim() : "";
      }
      program.customFields.forEach(cf=>{
        const el = document.getElementById('cf_'+cf.id);
        resp['custom__' + cf.id] = el ? el.value : "";
      });

      await sset('response:' + resp.id, resp);
      SAVING = false;
      SUBMITTED = true;
      render();
    });
  }
}

function attachAdminLoginEvents(){
  document.getElementById('pwCancel').onclick = ()=>{ VIEW="public"; render(); };
  const doLogin = ()=>{
    const uname = document.getElementById('userInput').value.trim();
    const pw = document.getElementById('pwInput').value;
    const user = USERS.find(u=> u.username === uname && u.password === pw);
    if(user && user.active){
      CURRENT_USER = user;
      const allowedTabs = ALL_PERMS.filter(p=> user.isOwner || user.permissions[p]);
      ADMIN_TAB = allowedTabs[0] || 'responses';
      VIEW = "admin";
      render();
    } else {
      document.getElementById('pwErr').style.display="block";
    }
  };
  document.getElementById('pwSubmit').onclick = doLogin;
  document.getElementById('pwInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('userInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

    <div class="card">
      <div class="section-title">إضافة سؤال جديد</div>
      <div class="row2">
        <div class="field"><label>نص السؤال</label><input type="text" id="newQLabel" placeholder="مثال: المدرسة الحالية"></div>
        <div class="field"><label>نوع الإجابة</label>
          <select id="newQType">
            <option value="text">إجابة نصية قصيرة</option>
            <option value="textarea">إجابة نصية طويلة</option>
            <option value="yesno">نعم / لا</option>
          </select>
        </div>
      </div>
      <button class="btn secondary" id="addQBtn">إضافة السؤال</button>
      <div style="margin-top:18px;">
        ${program.customFields.length ? program.customFields.map(cf=>`
          <div class="custom-field-item">
            <div class="cf-info"><b>${esc(cf.label)}</b><span>${cf.type==='text'?'نصية قصيرة':cf.type==='textarea'?'نصية طويلة':'نعم / لا'}</span></div>
            <button class="btn danger small removeQ" data-id="${cf.id}">حذف</button>
          </div>`).join("") : `<p class="muted-note">لا توجد أسئلة إضافية بعد.</p>`}
      </div>
    </div>`;
  }

  /* ---- Thank-you message ---- */
  if(ADMIN_TAB==='message') return `
    <div class="card">
      <div class="section-title">رسالة الشكر بعد التسجيل — ${esc(program.name)}</div>
      <div class="field">
        <label>نص الرسالة</label>
        <textarea id="cfgMsg" rows="3">${esc(program.thankYouMessage)}</textarea>
        <p class="hint">استخدم <code>{{program}}</code> ليتم استبدالها تلقائيًا باسم البرنامج.</p>
      </div>
      <button class="btn" id="saveMsg">حفظ الرسالة</button>
    </div>`;

  /* ---- Responses ---- */
  if(ADMIN_TAB==='responses') return `<div id="responsesArea"><div class="card"><p class="empty">جارِ تحميل الاستجابات...</p></div></div>`;

  /* ---- Users ---- */
  if(ADMIN_TAB==='users'){
    return `
    <div class="card">
      <div class="section-title">المستخدمون والصلاحيات</div>
      ${USERS.map(u=>`
        <div class="user-row">
          <div class="user-row-top">
            <div>
              <span class="user-name">${esc(u.username)}</span>
              ${u.isOwner ? `<span class="badge badge-owner">مالك</span>` : ""}
              ${!u.active ? `<span class="badge badge-off">معطّل</span>` : ""}
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
              ${!u.isOwner ? `
              <label class="switch" title="تفعيل / تعطيل المستخدم">
                <input type="checkbox" class="userActiveToggle" data-id="${u.id}" ${u.active?'checked':''}><span class="slider"></span>
              </label>
              <button class="btn danger small delUserBtn" data-id="${u.id}">حذف</button>` : `<span style="font-size:12px;color:var(--muted);">صلاحيات كاملة دائمًا</span>`}
            </div>
          </div>
          ${!u.isOwner ? `
          <div class="perm-grid">
            ${ALL_PERMS.map(p=>`
              <label class="perm-chk">
                <input type="checkbox" class="permChk" data-id="${u.id}" data-perm="${p}" ${u.permissions[p]?'checked':''}>
                ${PERM_LABELS[p]}
              </label>`).join("")}
          </div>` : ""}
        </div>`).join("")}
    </div>
    <div class="card">
      <div class="section-title">➕ إضافة مستخدم جديد</div>
      <div class="row2">
        <div class="field"><label>اسم المستخدم</label><input type="text" id="newUName" placeholder="مثال: مشرف_الاستجابات"></div>
        <div class="field"><label>كلمة المرور</label><input type="text" id="newUPass" placeholder="كلمة مرور"></div>
      </div>
      <label style="margin-bottom:8px;">الصلاحيات الممنوحة لهذا المستخدم</label>
      <div class="perm-grid">
        ${ALL_PERMS.map(p=>`
          <label class="perm-chk"><input type="checkbox" class="newUPerm" data-perm="${p}" ${p==='responses'?'checked':''}> ${PERM_LABELS[p]}</label>`).join("")}
      </div>
      <button class="btn secondary" id="addUserBtn">إضافة المستخدم</button>
      <p class="muted-note">مثال: يمكن إعطاء مستخدم صلاحية "عرض/تصدير الاستجابات" فقط دون بقية الصلاحيات.</p>
    </div>`;
  }

  return "";
}

function attachAdminEvents(){
  document.getElementById('goPublic').onclick = ()=>{ VIEW="public"; SUBMITTED=false; render(); };
  document.getElementById('logoutBtn').onclick = ()=>{ CURRENT_USER=null; VIEW="adminLogin"; render(); };
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{ ADMIN_TAB = t.dataset.tab; render(); };
  });
  const progSelect = document.getElementById('adminProgramSelect');
  if(progSelect) progSelect.onchange = ()=>{
    ADMIN_PROGRAM_ID = progSelect.value; // changing the program also refreshes the responses title/table
    render();
  };
  bindAdminTabEvents();
}

function toast(text){
  const t = document.createElement('div');
  t.className = 'msg-toast';
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 2200);
}

function refreshAdminTab(){ document.getElementById('adminContent').innerHTML = renderAdminTab(); bindAdminTabEvents(); }

function bindAdminTabEvents(){
  const program = getProgram(ADMIN_PROGRAM_ID) || PROGRAMS[0];

  if(ADMIN_TAB==='programs'){
    document.querySelectorAll('.editProgramBtn').forEach(btn=>{
      btn.onclick = ()=>{ EDIT_PROGRAM_ID = btn.dataset.id; refreshAdminTab(); };
    });
    document.querySelectorAll('.delProgramBtn').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm("سيتم حذف هذا البرنامج/الصف نهائيًا. هل أنت متأكد؟")) return;
        PROGRAMS = PROGRAMS.filter(p=>p.id!==btn.dataset.id);
        if(ADMIN_PROGRAM_ID===btn.dataset.id) ADMIN_PROGRAM_ID = PROGRAMS[0] ? PROGRAMS[0].id : null;
        if(EDIT_PROGRAM_ID===btn.dataset.id) EDIT_PROGRAM_ID = null;
        await sset('programs', PROGRAMS);
        render();
        toast("تم حذف البرنامج");
      };
    });
    document.getElementById('addProgramBtn').onclick = async ()=>{
      const name = document.getElementById('newProgramName').value.trim();
      if(!name){ alert("يرجى كتابة اسم البرنامج/الصف"); return; }
      const p = defaultProgram(name);
      PROGRAMS.push(p);
      EDIT_PROGRAM_ID = p.id;
      if(!ADMIN_PROGRAM_ID) ADMIN_PROGRAM_ID = p.id;
      await sset('programs', PROGRAMS);
      render();
      toast("تمت إضافة البرنامج/الصف ✓");
    };
    const editing = getProgram(EDIT_PROGRAM_ID) || PROGRAMS[0];
    if(editing){
      const logoInput = document.getElementById('logoInput');
      if(logoInput) logoInput.addEventListener('change', (e)=>{
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ()=>{ editing.logo = reader.result; sset('programs', PROGRAMS).then(()=>{ refreshAdminTab(); toast("تم تحديث الشعار"); }); };
        reader.readAsDataURL(file);
      });
      const rm = document.getElementById('removeLogo');
      if(rm) rm.onclick = ()=>{ editing.logo=""; sset('programs', PROGRAMS).then(refreshAdminTab); };

      const posterInput = document.getElementById('posterInput');
      if(posterInput) posterInput.addEventListener('change', (e)=>{
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ()=>{ editing.poster = reader.result; sset('programs', PROGRAMS).then(()=>{ refreshAdminTab(); toast("تم تحديث صورة البوستر"); }); };
        reader.readAsDataURL(file);
      });
      const rmp = document.getElementById('removePoster');
      if(rmp) rmp.onclick = ()=>{ editing.poster=""; sset('programs', PROGRAMS).then(refreshAdminTab); };

      const saveBtn = document.getElementById('saveProgram');
      if(saveBtn) saveBtn.onclick = async ()=>{
        editing.name = document.getElementById('cfgName').value.trim() || editing.name;
        editing.description = document.getElementById('cfgDesc').value.trim();
        await sset('programs', PROGRAMS);
        render();
        toast("تم الحفظ بنجاح ✓");
      };
    }
  }

  if(ADMIN_TAB==='schedule'){
    document.getElementById('saveSchedule').onclick = async ()=>{
      program.regStart = document.getElementById('cfgStart').value;
      program.regEnd = document.getElementById('cfgEnd').value;
      await sset('programs', PROGRAMS);
      refreshAdminTab();
      toast("تم حفظ المواعيد ✓");
    };
  }

  if(ADMIN_TAB==='fields'){
    document.querySelectorAll('.fieldToggle').forEach(cb=>{
      cb.onchange = async ()=>{ program.fields[cb.dataset.field] = cb.checked; await sset('programs', PROGRAMS); toast("تم التحديث ✓"); };
    });
    const ageToggle = document.getElementById('ageRestrictToggle');
    if(ageToggle) ageToggle.onchange = ()=>{
      document.getElementById('ageFrom').disabled = !ageToggle.checked;
      document.getElementById('ageTo').disabled = !ageToggle.checked;
    };
    const saveAge = document.getElementById('saveAgeRestrict');
    if(saveAge) saveAge.onclick = async ()=>{
      program.ageRestrict = document.getElementById('ageRestrictToggle').checked;
      program.ageFrom = document.getElementById('ageFrom').value.trim();
      program.ageTo = document.getElementById('ageTo').value.trim();
      await sset('programs', PROGRAMS);
      toast("تم حفظ إعدادات العمر 🎂");
    };
    document.getElementById('addQBtn').onclick = async ()=>{
      const label = document.getElementById('newQLabel').value.trim();
      const type = document.getElementById('newQType').value;
      if(!label){ alert("يرجى كتابة نص السؤال"); return; }
      program.customFields.push({id: newId('q'), label, type});
      await sset('programs', PROGRAMS);
      refreshAdminTab();
      toast("تمت إضافة السؤال ✓");
    };
    document.querySelectorAll('.removeQ').forEach(btn=>{
      btn.onclick = async ()=>{
        program.customFields = program.customFields.filter(cf=>cf.id!==btn.dataset.id);
        await sset('programs', PROGRAMS);
        refreshAdminTab();
      };
    });
  }

  if(ADMIN_TAB==='message'){
    document.getElementById('saveMsg').onclick = async ()=>{
      program.thankYouMessage = document.getElementById('cfgMsg').value.trim() || defaultProgram().thankYouMessage;
      await sset('programs', PROGRAMS);
      toast("تم حفظ الرسالة ✓");
    };
  }

  if(ADMIN_TAB==='responses'){
    loadResponses();
  }

  if(ADMIN_TAB==='users'){
    document.querySelectorAll('.userActiveToggle').forEach(cb=>{
      cb.onchange = async ()=>{
        const u = USERS.find(x=>x.id===cb.dataset.id);
        if(u){ u.active = cb.checked; await sset('users', USERS); toast(u.active ? "تم تفعيل المستخدم ✓" : "تم تعطيل المستخدم"); refreshAdminTab(); }
      };
    });
    document.querySelectorAll('.permChk').forEach(cb=>{
      cb.onchange = async ()=>{
        const u = USERS.find(x=>x.id===cb.dataset.id);
        if(u){ u.permissions[cb.dataset.perm] = cb.checked; await sset('users', USERS); toast("تم تحديث الصلاحيات ✓"); }
      };
    });
    document.querySelectorAll('.delUserBtn').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm("سيتم حذف هذا المستخدم نهائيًا. هل أنت متأكد؟")) return;
        USERS = USERS.filter(u=>u.id!==btn.dataset.id);
        await sset('users', USERS);
        refreshAdminTab();
        toast("تم حذف المستخدم");
      };
    });
    document.getElementById('addUserBtn').onclick = async ()=>{
      const username = document.getElementById('newUName').value.trim();
      const password = document.getElementById('newUPass').value.trim();
      if(!username || !password){ alert("يرجى إدخال اسم مستخدم وكلمة مرور"); return; }
      if(USERS.some(u=>u.username===username)){ alert("اسم المستخدم موجود مسبقًا"); return; }
      const perms = {};
      ALL_PERMS.forEach(p=> perms[p]=false);
      document.querySelectorAll('.newUPerm:checked').forEach(cb=> perms[cb.dataset.perm]=true);
      USERS.push({ id:newId('u'), username, password, active:true, isOwner:false, permissions:perms });
      await sset('users', USERS);
      refreshAdminTab();
      toast("تمت إضافة المستخدم ✓");
    };
  }
}

async function loadResponses(){
  const program = getProgram(ADMIN_PROGRAM_ID) || PROGRAMS[0];
  const keys = await slist('response:');
  const area = document.getElementById('responsesArea');
  if(!area) return;
  const results = await Promise.all(keys.map(k=> sget(k, null)));
  const responses = results.filter(r=> r && r.programId === (program ? program.id : null)).sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
  window.__responses = responses;

  if(!responses.length){
    area.innerHTML = `<div class="card"><p class="empty">لا توجد استجابات مسجّلة بعد لبرنامج «${esc(program?program.name:'')}».</p></div>`;
    return;
  }

  const cols = [
    ['name','الاسم'],
  ];
  if(program.fields.nationality) cols.push(['nationality','الجنسية']);
  if(program.fields.idNumber) cols.push(['idNumber','رقم البطاقة']);
  if(program.fields.birthdate){ cols.push(['birthdate','تاريخ الميلاد']); cols.push(['age','العمر']); }
  if(program.fields.studentPhone) cols.push(['studentPhone','جوال الطالب']);
  if(program.fields.guardianPhone) cols.push(['guardianPhone','جوال ولي الأمر']);
  if(program.fields.disease){ cols.push(['disease','يعاني من مرض']); cols.push(['diseaseDetail','تفاصيل المرض']); }
  program.customFields.forEach(cf=> cols.push(['custom__'+cf.id, cf.label]));
  cols.push(['submittedAt','تاريخ التسجيل']);

  area.innerHTML = `
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
      <div>
        <b style="font-family:'Cairo';color:var(--navy);font-size:16px;">استجابات: ${esc(program.name)}</b><br>
        <b style="font-family:'Cairo';color:var(--navy);">${responses.length}</b> <span style="color:var(--muted);font-size:13.5px;">طالبًا مسجّلاً</span>
      </div>
      <button class="btn secondary small" id="exportBtn">تصدير إلى إكسل 📊</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join("")}</tr></thead>
        <tbody>
          ${responses.map(r=>`<tr>${cols.map(c=>`<td>${esc(fmtCell(r[c[0]], c[0]))}</td>`).join("")}</tr>`).join("")}
        </tbody>
      </table>
    </div>`;

  document.getElementById('exportBtn').onclick = ()=> exportExcel(responses, cols, program);
}

function fmtCell(v, key){
  if(key==='submittedAt' && v){ try{ return new Date(v).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'}); }catch(e){ return v; } }
  return v==null ? "" : v;
}

function exportExcel(responses, cols, program){
  const header = cols.map(c=>c[1]);
  const rows = responses.map(r=> cols.map(c=> fmtCell(r[c[0]], c[0])));
  const data = [header, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = cols.map(c=> ({wch: Math.max(14, c[1].length+4)}));
  ws['!freeze'] = {xSplit:0, ySplit:1};
  const range = XLSX.utils.decode_range(ws['!ref']);
  ws['!autofilter'] = {ref: ws['!ref']};
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "الاستجابات");
  XLSX.writeFile(wb, `تسجيلات_${((program&&program.name)||'البرنامج').replace(/\s+/g,'_')}.xlsx`);
}

init();
</script>
