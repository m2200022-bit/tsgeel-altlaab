<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root{
    --navy:#7a1029;
    --navy-2:#4f0916;
    --teal:#b8863a;
    --teal-d:#8a641f;
    --gold:#c9a227;
    --paper:#f7f3ea;
    --card:#fffdf8;
    --ink:#241b1a;
    --muted:#6b6058;
    --line:#e8ddc9;
    --danger:#b8433a;

  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',sans-serif;
    background:
      repeating-linear-gradient(to bottom, transparent 0px, transparent 34px, rgba(122,16,41,0.04) 35px),
      var(--paper);

  .app{max-width:920px;margin:0 auto;padding:28px 16px 80px;}
  h1,h2,h3{font-family:'Cairo',sans-serif;margin:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;gap:12px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;}
  .seal{
    width:56px;height:56px;border-radius:50%;
    border:2.5px dashed var(--gold);
    display:flex;align-items:center;justify-content:center;
    background:var(--navy);color:#fff;flex-shrink:0;overflow:hidden;

  .link-btn{

  .topbar-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}

  .status-closed{background:#fdecea;color:var(--danger);border:1px solid #f3c9c4;}
  .status-dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex-shrink:0;}
  label{display:block;font-weight:700;font-size:14px;margin-bottom:6px;color:var(--navy-2);}

  .icon-inline{font-size:15px;}

  .logos-row .seal{width:52px;height:52px;position:relative;}
  .logos-row .seal .rm-logo{
    position:absolute;top:-6px;left:-6px;width:18px;height:18px;border-radius:50%;background:var(--danger);
    color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff;

<body>
<div id="root" class="app"></div>
<script type="module">
/* ---------------- Firebase (Firestore) ---------------- */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc,
  collection, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAt4Ucgdy8Ie-Ks41c40S4hslYnWIP2-s0",
  authDomain: "tsgeel2-5de49.firebaseapp.com",
  projectId: "tsgeel2-5de49",
  storageBucket: "tsgeel2-5de49.firebasestorage.app",
  messagingSenderId: "481866359635",
  appId: "1:481866359635:web:76089c3ac5c6179d4937a6",
  measurementId: "G-PNTL3RC0XG"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const COL = "app_data"; // every piece of app data (programs / users / each response) is one document in this collection

/* ---------------- Storage helpers (Firestore-backed, same key/value interface as before) ---------------- */
function safeDocId(key){ return key.replace(/\//g, "__"); } // Firestore doc IDs can't contain "/"

async function sget(key, fallback){
  try{
    const snap = await getDoc(doc(db, COL, safeDocId(key)));
    return snap.exists() ? snap.data().value : fallback;
  }catch(e){ console.error(e); return fallback; }
}
async function sset(key, value){
  try{ await setDoc(doc(db, COL, safeDocId(key)), { key, value }); }
  catch(e){ console.error(e); }
}
async function sdel(key){
  try{ await deleteDoc(doc(db, COL, safeDocId(key))); }catch(e){ console.error(e); }
}
async function slist(prefix){
  try{
    const q = query(collection(db, COL), where("key", ">=", prefix), where("key", "<", prefix + "\uf8ff"));
    const snaps = await getDocs(q);
    const keys = [];
    snaps.forEach(s=> keys.push(s.data().key));
    return keys;
  }catch(e){ console.error(e); return []; }
}

const DEFAULT_FIELDS = {
  nationality:true, idNumber:true, birthdate:true, studentPhone:true, guardianPhone:true, disease:true
};

function newId(prefix){ return prefix + Date.now() + Math.random().toString(36).slice(2,7); }

/* the fixed set of "block" keys every program's field order is built from (custom field ids get appended) */
function defaultFieldOrder(){ return ['nationality','idNumber','birthdate','phones','disease']; }
const ORDER_LABELS = {
  nationality:"الجنسية", idNumber:"رقم البطاقة الشخصية", birthdate:"تاريخ الميلاد والعمر",
  phones:"أرقام الجوال (الطالب / ولي الأمر)", disease:"سؤال الأمراض"
};

function defaultProgram(name){
  return {
    id: newId('p'),
    name: name || "برنامجنا التدريبي",
    description: "يرجى تعبئة النموذج أدناه لإتمام عملية التسجيل.",
    orgName: "",
    logos: [], // array of image data-URLs (can hold more than one logo)
    poster: "",
    visibleToPublic: true,
    regStart: "",
    regEnd: "",
    thankYouMessage: "تم تسجيلكم بنجاح في برنامج {{program}}. شكرًا لكم!",
    fields: Object.assign({}, DEFAULT_FIELDS),
    customFields: [], // {id,label,type:'text'|'yesno'|'textarea'}
    fieldOrder: defaultFieldOrder(),
    ageRestrict: false,
    ageFrom: "",
    ageTo: ""
  };
}

/* keeps older / partially-saved program objects valid after new features are added */
function normalizeProgram(p){
  if(!Array.isArray(p.logos)) p.logos = p.logo ? [p.logo] : [];
  if(p.orgName === undefined) p.orgName = "";
  if(p.visibleToPublic === undefined) p.visibleToPublic = true;
  if(!p.customFields) p.customFields = [];
  if(!p.fields) p.fields = Object.assign({}, DEFAULT_FIELDS);
  const customIds = p.customFields.map(cf=>cf.id);
  const standardKeys = defaultFieldOrder();
  let order = Array.isArray(p.fieldOrder) ? p.fieldOrder.filter(k=> standardKeys.includes(k) || customIds.includes(k)) : [];
  standardKeys.forEach(k=>{ if(!order.includes(k)) order.push(k); });
  customIds.forEach(id=>{ if(!order.includes(id)) order.push(id); });
  p.fieldOrder = order;
  return p;
}

const ALL_PERMS = ['programs','schedule','fields','message','responses','users','announcement'];
const DEFAULT_ADMIN_PASSWORD = "974974";
function fullPerms(){ const p={}; ALL_PERMS.forEach(k=> p[k]=true); return p; }
const CF_TYPE_LABELS = {
  text:"نصية قصيرة", textarea:"نصية طويلة", yesno:"نعم / لا",
  dropdown:"قائمة منسدلة", checkbox:"مربع اختيار", multichoice:"خيارات متعددة", file:"رفع ملف"
};
const PERM_LABELS = {
  programs:"إدارة البرامج/الصفوف", schedule:"مواعيد التسجيل", fields:"الأسئلة وعمر المشتركين",
  message:"رسالة الشكر", responses:"عرض/تصدير الاستجابات", users:"إدارة المستخدمين",
  announcement:"الرسالة المنبثقة للجمهور"
};

function defaultOwner(username, password){
  return {

/* ---------------- Init ---------------- */
async function init(){
  PROGRAMS = await sget('programs', null);
  USERS = await sget('users', null);
  SITE = await sget('site-settings', null) || defaultSite();

  if(!PROGRAMS){
    // migrate from the old single-program config, if present
    const old = await sget('app-config', null);
    if(old){
      const p = defaultProgram(old.programName);
      p.description = old.programDescription || p.description;
      p.logos = old.logo ? [old.logo] : [];
      p.regStart = old.regStart || "";
      p.regEnd = old.regEnd || "";
      p.thankYouMessage = old.thankYouMessage || p.thankYouMessage;
      p.fields = Object.assign({}, DEFAULT_FIELDS, old.fields || {});
      p.customFields = old.customFields || [];
      PROGRAMS = [p];
      if(!USERS) USERS = [defaultOwner('admin', old.adminPassword || 'admin123')];
    } else {
      PROGRAMS = [defaultProgram()];
    }
    await sset('programs', PROGRAMS);
  }
  PROGRAMS = PROGRAMS.map(normalizeProgram);
  if(!USERS){ USERS = [defaultOwner()]; await sset('users', USERS); }

  ADMIN_PROGRAM_ID = PROGRAMS[0] ? PROGRAMS[0].id : null;
  // if no program is pinned yet for the public page, default to the first enabled one
  if(!SITE.displayedProgramId || !getProgram(SITE.displayedProgramId)){
    const firstVisible = PROGRAMS.find(p=>p.visibleToPublic);
    if(firstVisible){ SITE.displayedProgramId = firstVisible.id; await sset('site-settings', SITE); }
  }

  VIEW = "public";
  render();
}

function getProgram(id){ return PROGRAMS.find(p=>p.id===id) || null; }

/* ---------------- Once-per-day auto backup (client-side best effort) ----------------
   There is no server/cron in a static page, so this triggers an Excel backup download
   the first time an admin with access opens the control panel on a new calendar day. */
async function maybeAutoBackup(){
  const today = new Date().toISOString().slice(0,10);
  if(SITE.lastBackupDate === today) return;
  const keys = await slist('response:');
  if(keys.length){
    const results = await Promise.all(keys.map(k=> sget(k, null)));
    const all = results.filter(Boolean);
    exportBackupWorkbook(all, `نسخة_احتياطية_${today}.xlsx`);
  }
  SITE.lastBackupDate = today;
  await sset('site-settings', SITE);
}

function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function calcAge(dobStr){
  if(!dobStr) return "";
  const dob = new Date(dobStr);
  if(isNaN(dob)) return "";
  const today = new Date();
  let age = today.getFullYear() - dob.getFullYear();
  const m = today.getMonth() - dob.getMonth();
  if(m < 0 || (m===0 && today.getDate() < dob.getDate())) age--;
  return age >= 0 ? age : "";
}

function regStatus(program){
  const now = new Date();
  const start = program.regStart ? new Date(program.regStart) : null;
  const end = program.regEnd ? new Date(program.regEnd) : null;
  if(start && now < start) return {open:false, reason:"لم يبدأ التسجيل بعد", when: fmtDT(start)};
  if(end && now > end) return {open:false, reason:"انتهى وقت التسجيل", when: fmtDT(end)};
  return {open:true, closesAt: end ? fmtDT(end) : null};
}

/* birth-year age restriction check: returns true if allowed */
function ageAllowed(program, dobStr){
  if(!program.ageRestrict) return true;
  if(!dobStr) return true;
  const y = new Date(dobStr).getFullYear();
  if(isNaN(y)) return true;
  const from = parseInt(program.ageFrom, 10);
  const to = parseInt(program.ageTo, 10);
  if(!isNaN(from) && y < from) return false;
  if(!isNaN(to) && y > to) return false;
  return true;
}
function fmtDT(d){
  try{ return d.toLocaleString('ar-EG', {dateStyle:'medium', timeStyle:'short'}); }catch(e){ return d.toString(); }
}

/* ---------------- Render root ---------------- */
function render(){
  const root = document.getElementById('root');
  if(VIEW !== "public" && countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
  if(VIEW === "loading"){ root.innerHTML = "<p style='text-align:center;padding:60px;color:#6b7686'>جارِ التحميل...</p>"; return; }
  if(VIEW === "adminLogin"){ root.innerHTML = renderAdminLogin(); attachAdminLoginEvents(); return; }
  if(VIEW === "admin"){ root.innerHTML = renderAdmin(); attachAdminEvents(); return; }
  root.innerHTML = renderPublic();
  attachPublicEvents();
}

  if(!program.logos || !program.logos.length){
    return `<div class="seal" style="${size?`width:${size}px;height:${size}px;`:''}"><span class="init">${esc((program.name||"ب").trim()[0]||"ب")}</span></div>`;

}

/* the single program to show on the main public screen: the one pinned in admin settings,
   falling back to the first enabled program if that pin is missing/disabled */
function getDisplayedProgram(){
  const pinned = getProgram(SITE.displayedProgramId);
  if(pinned && pinned.visibleToPublic) return pinned;
  return PROGRAMS.find(p=>p.visibleToPublic) || null;
}

      <div class="field">
        <label>الجنسية <span class="req">*</span></label>
        <div class="search-wrap">
          <input type="text" id="f_nat_search" placeholder="ابحث عن الجنسية..." autocomplete="off" required>
          <input type="hidden" id="f_nat_value">
          <div class="search-list" id="natList"></div>
        </div>
      </div>`;
  }
  if(key === 'idNumber'){
    if(!program.fields.idNumber) return "";
    return `
      <div class="field">
        <label>رقم البطاقة الشخصية <span class="req">*</span></label>
        <input type="text" id="f_idnum" required placeholder="رقم البطاقة">
      </div>`;
  }
  if(key === 'birthdate'){
    if(!program.fields.birthdate) return "";
    const ageHint = program.ageRestrict ? `
      <div class="age-note"><span class="icon-inline">🎂</span> يسمح بالتسجيل لمواليد من ${esc(program.ageFrom||"—")} إلى ${esc(program.ageTo||"—")} فقط</div>` : "";
    return `
      <div class="row2">
        <div class="field">
          <label class="field-icon-label">تاريخ الميلاد <span class="req">*</span> ${program.ageRestrict ? '<span class="icon-inline" title="يوجد تحكم بعمر المشتركين">🎂</span>' : ''}</label>
          <input type="date" id="f_dob" required>
        </div>
        <div class="field">
          <label>العمر</label>
          <input type="text" id="f_age" readonly placeholder="يُحسب تلقائيًا">
        </div>
      </div>
      ${ageHint}
      <div class="err" id="ageErr" style="display:none;">تاريخ الميلاد خارج نطاق العمر المسموح به لهذا البرنامج.</div>`;
  }
  if(key === 'phones'){
    const s = program.fields.studentPhone, g = program.fields.guardianPhone;
    if(!s && !g) return "";
    return `
      <div class="row2">
        ${s ? `
        <div class="field">
          <label>رقم جوال الطالب <span class="req">*</span></label>
          <input type="tel" id="f_sphone" required maxlength="8" inputmode="numeric" placeholder="8 أرقام">
        </div>` : ""}
        ${g ? `
        <div class="field">
          <label>رقم جوال ولي الأمر <span class="req">*</span></label>
          <input type="tel" id="f_gphone" required maxlength="8" inputmode="numeric" placeholder="8 أرقام">
        </div>` : ""}
      </div>`;
  }
  if(key === 'disease'){
    if(!program.fields.disease) return "";
    return `
      <div class="field">
        <label>هل يعاني الطالب من أي أمراض لا سمح الله؟ <span class="req">*</span></label>
        <div class="radio-row">
          <div class="radio-opt" data-val="لا" id="disease_no">لا</div>
          <div class="radio-opt" data-val="نعم" id="disease_yes">نعم</div>
        </div>
        <input type="hidden" id="f_disease">
        <div id="diseaseDetailWrap" style="display:none;margin-top:12px;">
          <label>يرجى ذكر المرض</label>
          <textarea id="f_disease_detail" rows="2" placeholder="اكتب تفاصيل المرض هنا"></textarea>
        </div>
      </div>`;
  }
  // otherwise it's a custom field id

  return cf ? renderCustomFieldPublic(cf) : "";

function startCountdown(program){
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
  const el = document.getElementById('closeCountdown');
  if(!el || !program.regEnd) return;
  const end = new Date(program.regEnd);
  const tick = ()=>{
    const diff = end - new Date();
    if(diff <= 0){
      if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
      render(); // registration just closed — re-render to show the closed state
      return;
    }
    const d = Math.floor(diff/86400000);
    const h = Math.floor((diff%86400000)/3600000);
    const m = Math.floor((diff%3600000)/60000);
    const s = Math.floor((diff%60000)/1000);
    const parts = [];
    if(d) parts.push(d+" يوم");
    if(d || h) parts.push(h+" ساعة");
    if(d || h || m) parts.push(m+" دقيقة");
    if(!d && !h) parts.push(s+" ثانية");
    el.textContent = "⏳ يتبقى على إغلاق التسجيل: " + parts.join(" و ");
  };
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function attachPublicEvents(){
  const goAdmin = document.getElementById('goAdmin');
  if(goAdmin) goAdmin.onclick = ()=>{ VIEW="adminLogin"; render(); };

  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.onclick = ()=>{ SUBMITTED=false; render(); };

  // public announcement popup
  const popupX = document.getElementById('popupCloseX');
  if(popupX) popupX.onclick = ()=>{ POPUP_DISMISSED = true; render(); };
  const popupCta = document.getElementById('popupCtaBtn');
  if(popupCta) popupCta.onclick = ()=>{
    const url = (SITE.popupLinkUrl||"").trim();
    if(url) window.location.href = url; // navigates the visitor away from the site
    else { POPUP_DISMISSED = true; render(); }
  };

  const program = getDisplayedProgram();
  if(!program){ if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; } return; }
  startCountdown(program);
  if(!program.visibleToPublic) return;

  // nationality search
  const natSearch = document.getElementById('f_nat_search');
  if(natSearch){
    const natList = document.getElementById('natList');
    const showList = (items)=>{
      natList.innerHTML = items.map(n=>`<div class="search-item" data-v="${esc(n)}">${esc(n)}</div>`).join("") || `<div class="search-item" style="color:#999">لا توجد نتائج</div>`;
      natList.classList.add('show');
      natList.querySelectorAll('.search-item[data-v]').forEach(el=>{
        el.onclick = ()=>{ natSearch.value = el.dataset.v; document.getElementById('f_nat_value').value = el.dataset.v; natList.classList.remove('show'); };
      });
    };
    natSearch.addEventListener('focus', ()=> showList(NATIONALITIES));
    natSearch.addEventListener('input', ()=>{
      document.getElementById('f_nat_value').value = "";
      const q = natSearch.value.trim();
      showList(q ? NATIONALITIES.filter(n=>n.includes(q)) : NATIONALITIES);
    });
    document.addEventListener('click', (e)=>{ if(!e.target.closest('.search-wrap')) natList.classList.remove('show'); }, {once:false});
  }

  // dob -> age (+ age-restriction check)
  const dob = document.getElementById('f_dob');
  if(dob) dob.addEventListener('change', ()=>{
    document.getElementById('f_age').value = calcAge(dob.value) + (dob.value ? " سنة" : "");
    const ageErr = document.getElementById('ageErr');
    const submitBtn = document.querySelector('#regForm button[type=submit]');
    if(ageErr){
      const ok = ageAllowed(program, dob.value);
      ageErr.style.display = ok ? "none" : "block";
      if(submitBtn) submitBtn.disabled = !ok;
    }
  });

  // disease yes/no
  const yesBtn = document.getElementById('disease_yes'), noBtn = document.getElementById('disease_no');
  if(yesBtn && noBtn){
    const detailWrap = document.getElementById('diseaseDetailWrap');
    const setVal = (v)=>{
      document.getElementById('f_disease').value = v;
      yesBtn.classList.toggle('active', v==="نعم");
      noBtn.classList.toggle('active', v==="لا");
      detailWrap.style.display = v==="نعم" ? "block" : "none";
    };
    yesBtn.onclick = ()=> setVal("نعم");
    noBtn.onclick = ()=> setVal("لا");
    setVal("لا");
  }

  // student / guardian phone numbers: digits only, exactly 8 digits
  ['f_sphone','f_gphone'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', ()=>{ el.value = el.value.replace(/\D/g,'').slice(0,8); });
  });

  // custom yes/no fields
  document.querySelectorAll('.cf-opt').forEach(el=>{
    el.onclick = ()=>{
      const cfId = el.dataset.cf, val = el.dataset.val;
      document.getElementById('cf_'+cfId).value = val;
      document.querySelectorAll(`.cf-opt[data-cf="${cfId}"]`).forEach(o=> o.classList.toggle('active', o===el));
    };
  });

  const form = document.getElementById('regForm');
  if(form){
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(SAVING) return;
      // nationality must be picked from list
      if(program.fields.nationality){
        const val = document.getElementById('f_nat_value').value;
        if(!val){ alert("يرجى اختيار الجنسية من القائمة"); return; }
      }
      // age restriction re-check on submit
      if(program.fields.birthdate){
        const dobVal = document.getElementById('f_dob').value;
        if(!ageAllowed(program, dobVal)){
          document.getElementById('ageErr').style.display = "block";
          alert("عذرًا، تاريخ الميلاد المدخل خارج نطاق العمر المسموح به لهذا البرنامج.");
          return;
        }
      }
      // phone numbers must be exactly 8 digits
      if(program.fields.studentPhone && !/^\d{8}$/.test(document.getElementById('f_sphone').value.trim())){
        alert("رقم جوال الطالب يجب أن يتكون من 8 أرقام فقط"); return;
      }
      if(program.fields.guardianPhone && !/^\d{8}$/.test(document.getElementById('f_gphone').value.trim())){
        alert("رقم جوال ولي الأمر يجب أن يتكون من 8 أرقام فقط"); return;
      }
      SAVING = true;
      const submitBtn = form.querySelector('button[type=submit]');
      submitBtn.textContent = "جارِ الإرسال...";
      submitBtn.disabled = true;

      const resp = {
        id: 'r' + Date.now() + Math.random().toString(36).slice(2,8),
        programId: program.id,
        submittedAt: new Date().toISOString(),
        name: document.getElementById('f_name').value.trim(),
      };
      if(program.fields.nationality) resp.nationality = document.getElementById('f_nat_value').value;
      if(program.fields.idNumber) resp.idNumber = document.getElementById('f_idnum').value.trim();
      if(program.fields.birthdate){
        resp.birthdate = document.getElementById('f_dob').value;
        resp.age = calcAge(resp.birthdate);
      }
      if(program.fields.studentPhone) resp.studentPhone = document.getElementById('f_sphone').value.trim();
      if(program.fields.guardianPhone) resp.guardianPhone = document.getElementById('f_gphone').value.trim();
      if(program.fields.disease){
        resp.disease = document.getElementById('f_disease').value || "لا";
        resp.diseaseDetail = resp.disease === "نعم" ? document.getElementById('f_disease_detail').value.trim() : "";
      }
      program.customFields.forEach(cf=>{
        if(cf.type === 'checkbox'){
          const el = document.getElementById('cf_'+cf.id);
          resp['custom__' + cf.id] = el && el.checked ? 'نعم' : 'لا';
          return;
        }
        const el = document.getElementById('cf_'+cf.id);
        resp['custom__' + cf.id] = el ? el.value : "";
      });

      await sset('response:' + resp.id, resp);
      SAVING = false;
      SUBMITTED = true;
      render();
    });
  }
}

function attachAdminLoginEvents(){
  document.getElementById('pwCancel').onclick = ()=>{ VIEW="public"; render(); };
  const doLogin = async ()=>{
    const pw = document.getElementById('pwInput').value;
    const submitBtn = document.getElementById('pwSubmit');
    submitBtn.disabled = true;
    const stored = await sget('admin-password', DEFAULT_ADMIN_PASSWORD);
    submitBtn.disabled = false;
    if(pw === stored){
      CURRENT_USER = { username:"مدير النظام", isOwner:true, permissions: fullPerms() };
      ADMIN_TAB = 'programs';
      VIEW = "admin";
      render();
    } else {
      document.getElementById('pwErr').style.display="block";
    }
  };
  document.getElementById('pwSubmit').onclick = doLogin;
  document.getElementById('pwInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

      <div class="section-title">🔑 تغيير كلمة مرور لوحة التحكم</div>
      <p class="muted-note" style="margin-bottom:14px;">تُستخدم كلمة المرور هذه للدخول إلى لوحة التحكم من صفحة "دخول لوحة التحكم".</p>
      <div class="row2">
        <div class="field"><label>كلمة المرور الحالية</label><input type="password" id="curPw" placeholder="كلمة المرور الحالية"></div>
        <div class="field"><label>كلمة المرور الجديدة</label><input type="password" id="newPw" placeholder="كلمة المرور الجديدة"></div>
      </div>
      <div class="err" id="pwSettingsErr" style="display:none;">كلمة المرور الحالية غير صحيحة</div>
      <button class="btn secondary" id="savePwBtn">حفظ كلمة المرور الجديدة</button>
    </div>`;
  }

  return "";
}

function attachAdminEvents(){
  document.getElementById('goPublic').onclick = ()=>{ VIEW="public"; SUBMITTED=false; render(); };
  document.getElementById('logoutBtn').onclick = ()=>{ CURRENT_USER=null; VIEW="adminLogin"; render(); };
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{ ADMIN_TAB = t.dataset.tab; render(); };
  });
  const progSelect = document.getElementById('adminProgramSelect');
  if(progSelect) progSelect.onchange = ()=>{
    ADMIN_PROGRAM_ID = progSelect.value; // changing the program also refreshes the responses title/table
    render();
  };
  const refreshBtn = document.getElementById('globalRefreshBtn');
  if(refreshBtn) refreshBtn.onclick = async ()=>{
    PROGRAMS = (await sget('programs', PROGRAMS)).map(normalizeProgram);
    USERS = await sget('users', USERS);
    SITE = await sget('site-settings', SITE) || defaultSite();
    render();
    toast("تم تحديث البيانات 🔄");
  };
  // once-per-day auto backup, only attempted for users who can actually read responses
  if(CURRENT_USER && (CURRENT_USER.isOwner || CURRENT_USER.permissions.responses)){
    maybeAutoBackup().catch(()=>{});
  }
  bindAdminTabEvents();
}

function toast(text){
  const t = document.createElement('div');
  t.className = 'msg-toast';
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 2200);
}

function refreshAdminTab(){ document.getElementById('adminContent').innerHTML = renderAdminTab(); bindAdminTabEvents(); }

function bindAdminTabEvents(){
  const program = getProgram(ADMIN_PROGRAM_ID) || PROGRAMS[0];

  if(ADMIN_TAB==='programs'){
    const displaySelect = document.getElementById('displayedProgramSelect');
    if(displaySelect) displaySelect.onchange = async ()=>{
      SITE.displayedProgramId = displaySelect.value;
      await sset('site-settings', SITE);
      refreshAdminTab();
      toast("تم تحديد البرنامج المعروض في الشاشة الرئيسية ✓");
    };
    document.querySelectorAll('.editProgramBtn').forEach(btn=>{
      btn.onclick = ()=>{ EDIT_PROGRAM_ID = btn.dataset.id; refreshAdminTab(); };
    });
    document.querySelectorAll('.delProgramBtn').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm("سيتم حذف هذا البرنامج/الصف نهائيًا. هل أنت متأكد؟")) return;
        PROGRAMS = PROGRAMS.filter(p=>p.id!==btn.dataset.id);
        if(ADMIN_PROGRAM_ID===btn.dataset.id) ADMIN_PROGRAM_ID = PROGRAMS[0] ? PROGRAMS[0].id : null;
        if(EDIT_PROGRAM_ID===btn.dataset.id) EDIT_PROGRAM_ID = null;
        await sset('programs', PROGRAMS);
        render();
        toast("تم حذف البرنامج");
      };
    });
    document.getElementById('addProgramBtn').onclick = async ()=>{
      const name = document.getElementById('newProgramName').value.trim();
      if(!name){ alert("يرجى كتابة اسم البرنامج/الصف"); return; }
      const p = defaultProgram(name);
      PROGRAMS.push(p);
      EDIT_PROGRAM_ID = p.id;
      if(!ADMIN_PROGRAM_ID) ADMIN_PROGRAM_ID = p.id;
      await sset('programs', PROGRAMS);
      render();
      toast("تمت إضافة البرنامج/الصف ✓");
    };
    const refreshProgramsBtn = document.getElementById('refreshProgramsBtn');
    if(refreshProgramsBtn) refreshProgramsBtn.onclick = async ()=>{
      PROGRAMS = (await sget('programs', PROGRAMS)).map(normalizeProgram);
      render();
      toast("تم تحديث قائمة البرامج 🔄");
    };
    const editing = getProgram(EDIT_PROGRAM_ID) || PROGRAMS[0];
    if(editing){
      const logoInput = document.getElementById('logoInput');
      if(logoInput) logoInput.addEventListener('change', (e)=>{
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ()=>{ editing.logos.push(reader.result); sset('programs', PROGRAMS).then(()=>{ refreshAdminTab(); toast("تمت إضافة الشعار"); }); };
        reader.readAsDataURL(file);
      });
      document.querySelectorAll('.removeLogoBtn').forEach(btn=>{
        btn.onclick = ()=>{ editing.logos.splice(parseInt(btn.dataset.idx,10),1); sset('programs', PROGRAMS).then(refreshAdminTab); };
      });

      const posterInput = document.getElementById('posterInput');
      if(posterInput) posterInput.addEventListener('change', (e)=>{
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ()=>{ editing.poster = reader.result; sset('programs', PROGRAMS).then(()=>{ refreshAdminTab(); toast("تم تحديث صورة البوستر"); }); };
        reader.readAsDataURL(file);
      });
      const rmp = document.getElementById('removePoster');
      if(rmp) rmp.onclick = ()=>{ editing.poster=""; sset('programs', PROGRAMS).then(refreshAdminTab); };

      const saveBtn = document.getElementById('saveProgram');
      if(saveBtn) saveBtn.onclick = async ()=>{
        editing.orgName = document.getElementById('cfgOrg').value.trim();
        editing.name = document.getElementById('cfgName').value.trim() || editing.name;
        editing.description = document.getElementById('cfgDesc').value.trim();
        editing.visibleToPublic = document.getElementById('cfgVisible').checked;
        await sset('programs', PROGRAMS);
        render();
        toast("تم الحفظ بنجاح ✓");
      };
    }
  }

  if(ADMIN_TAB==='schedule'){
    document.getElementById('saveSchedule').onclick = async ()=>{
      program.regStart = document.getElementById('cfgStart').value;
      program.regEnd = document.getElementById('cfgEnd').value;
      await sset('programs', PROGRAMS);
      refreshAdminTab();
      toast("تم حفظ المواعيد ✓");
    };
  }

  if(ADMIN_TAB==='fields'){
    document.querySelectorAll('.fieldToggle').forEach(cb=>{
      cb.onchange = async ()=>{ program.fields[cb.dataset.field] = cb.checked; await sset('programs', PROGRAMS); toast("تم التحديث ✓"); };
    });
    document.querySelectorAll('.orderFirstBtn').forEach(btn=>{
      btn.onclick = async ()=>{
        const i = parseInt(btn.dataset.idx,10);
        if(i<=0) return;
        const [item] = program.fieldOrder.splice(i,1);
        program.fieldOrder.unshift(item);
        await sset('programs', PROGRAMS);
        refreshAdminTab();
        toast("تم نقل السؤال إلى الأول ✓");
      };
    });
    document.querySelectorAll('.orderUpBtn').forEach(btn=>{
      btn.onclick = async ()=>{
        const i = parseInt(btn.dataset.idx,10);
        if(i<=0) return;
        [program.fieldOrder[i-1], program.fieldOrder[i]] = [program.fieldOrder[i], program.fieldOrder[i-1]];
        await sset('programs', PROGRAMS);
        refreshAdminTab();
      };
    });
    document.querySelectorAll('.orderDownBtn').forEach(btn=>{
      btn.onclick = async ()=>{
        const i = parseInt(btn.dataset.idx,10);
        if(i>=program.fieldOrder.length-1) return;
        [program.fieldOrder[i+1], program.fieldOrder[i]] = [program.fieldOrder[i], program.fieldOrder[i+1]];
        await sset('programs', PROGRAMS);
        refreshAdminTab();
      };
    });
    document.querySelectorAll('.orderLastBtn').forEach(btn=>{
      btn.onclick = async ()=>{
        const i = parseInt(btn.dataset.idx,10);
        if(i>=program.fieldOrder.length-1) return;
        const [item] = program.fieldOrder.splice(i,1);
        program.fieldOrder.push(item);
        await sset('programs', PROGRAMS);
        refreshAdminTab();
        toast("تم نقل السؤال إلى الأخير ✓");
      };
    });
    const ageToggle = document.getElementById('ageRestrictToggle');
    if(ageToggle) ageToggle.onchange = ()=>{
      document.getElementById('ageFrom').disabled = !ageToggle.checked;
      document.getElementById('ageTo').disabled = !ageToggle.checked;
    };
    const saveAge = document.getElementById('saveAgeRestrict');
    if(saveAge) saveAge.onclick = async ()=>{
      program.ageRestrict = document.getElementById('ageRestrictToggle').checked;
      program.ageFrom = document.getElementById('ageFrom').value.trim();
      program.ageTo = document.getElementById('ageTo').value.trim();
      await sset('programs', PROGRAMS);
      toast("تم حفظ إعدادات العمر 🎂");
    };
    const newQType = document.getElementById('newQType');
    if(newQType){
      const syncQTypeFields = ()=>{
        const t = newQType.value;
        document.getElementById('newQOptionsWrap').style.display = (t==='dropdown' || t==='multichoice') ? 'block' : 'none';
        document.getElementById('newQFileWrap').style.display = (t==='file') ? 'block' : 'none';
      };
      newQType.onchange = syncQTypeFields;
      syncQTypeFields();
    }
    document.getElementById('addQBtn').onclick = async ()=>{
      const label = document.getElementById('newQLabel').value.trim();
      const type = document.getElementById('newQType').value;
      if(!label){ alert("يرجى كتابة نص السؤال"); return; }
      const cf = {id: newId('q'), label, type};
      if(type==='dropdown' || type==='multichoice'){
        const opts = document.getElementById('newQOptions').value.split('\n').map(s=>s.trim()).filter(Boolean);
        if(!opts.length){ alert("يرجى إدخال خيار واحد على الأقل"); return; }
        cf.options = opts;
      }
      if(type==='file'){
        cf.uploadLink = document.getElementById('newQFileLink').value.trim();
      }
      program.customFields.push(cf);
      program.fieldOrder.push(cf.id);
      await sset('programs', PROGRAMS);
      refreshAdminTab();
      toast("تمت إضافة السؤال ✓");
    };
    document.querySelectorAll('.removeQ').forEach(btn=>{
      btn.onclick = async ()=>{
        program.customFields = program.customFields.filter(cf=>cf.id!==btn.dataset.id);
        program.fieldOrder = program.fieldOrder.filter(k=>k!==btn.dataset.id);
        await sset('programs', PROGRAMS);
        refreshAdminTab();
      };
    });
  }

  if(ADMIN_TAB==='message'){
    document.getElementById('saveMsg').onclick = async ()=>{
      program.thankYouMessage = document.getElementById('cfgMsg').value.trim() || defaultProgram().thankYouMessage;
      await sset('programs', PROGRAMS);
      toast("تم حفظ الرسالة ✓");
    };
  }

  if(ADMIN_TAB==='announcement'){
    document.getElementById('savePopup').onclick = async ()=>{
      SITE.popupEnabled = document.getElementById('popupEnabledToggle').checked;
      SITE.popupMessage = document.getElementById('popupMsg').value.trim();
      SITE.popupButtonText = document.getElementById('popupBtnText').value.trim() || "متابعة";
      SITE.popupLinkUrl = document.getElementById('popupUrl').value.trim();
      await sset('site-settings', SITE);
      toast("تم حفظ الرسالة المنبثقة ✓");
    };
  }

  if(ADMIN_TAB==='responses'){
    loadResponses();
  }

  if(ADMIN_TAB==='settings'){
    document.getElementById('savePwBtn').onclick = async ()=>{
      const cur = document.getElementById('curPw').value;
      const nw = document.getElementById('newPw').value.trim();
      const errEl = document.getElementById('pwSettingsErr');
      errEl.style.display = "none";
      const stored = await sget('admin-password', DEFAULT_ADMIN_PASSWORD);
      if(cur !== stored){ errEl.style.display = "block"; return; }
      if(!nw || nw.length < 4){ alert("يرجى إدخال كلمة مرور جديدة لا تقل عن 4 أحرف"); return; }
      await sset('admin-password', nw);
      document.getElementById('curPw').value = "";
      document.getElementById('newPw').value = "";
      toast("تم تحديث كلمة المرور ✓");
    };
  }
}

function buildStatsHtml(program, responses){
  const total = responses.length;
  const boxes = [];

  boxes.push(`<div class="stat-box"><div class="snum">${total}</div><div class="slabel">إجمالي المسجّلين</div></div>`);

  if(program.fields.nationality){
    const counts = {};
    responses.forEach(r=>{ if(r.nationality) counts[r.nationality] = (counts[r.nationality]||0)+1; });
    const distinct = Object.keys(counts).length;
    const top = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
    boxes.push(`<div class="stat-box">
      <div class="snum">${distinct}</div><div class="slabel">عدد الجنسيات المختلفة</div>
      <div class="sbreak">${top.map(([n,c])=>`<span class="stat-chip">${esc(n)}: ${c}</span>`).join("")}</div>
    </div>`);
  }

  if(program.fields.birthdate){
    const ages = responses.map(r=>r.age).filter(a=> typeof a === 'number' && !isNaN(a));
    if(ages.length){
      const avg = Math.round(ages.reduce((a,b)=>a+b,0) / ages.length);
      const min = Math.min(...ages), max = Math.max(...ages);
      boxes.push(`<div class="stat-box"><div class="snum">${avg}</div><div class="slabel">متوسط العمر (من ${min} إلى ${max})</div></div>`);
    }
  }

  if(program.fields.disease){
    const sick = responses.filter(r=> r.disease === 'نعم').length;
    boxes.push(`<div class="stat-box"><div class="snum">${sick}</div><div class="slabel">لديهم أمراض مسجّلة</div></div>`);
  }

  program.customFields.filter(cf=> cf.type==='file').forEach(cf=>{
    const uploaded = responses.filter(r=> (r['custom__'+cf.id]||'').trim() !== '').length;
    boxes.push(`<div class="stat-box"><div class="snum">${uploaded}</div><div class="slabel">أرفقوا ملفًا — "${esc(cf.label)}"</div></div>`);
  });

  program.customFields.filter(cf=> cf.type==='yesno' || cf.type==='checkbox').forEach(cf=>{
    const yes = responses.filter(r=> r['custom__'+cf.id] === 'نعم').length;
    boxes.push(`<div class="stat-box"><div class="snum">${yes}</div><div class="slabel">أجابوا "نعم" — "${esc(cf.label)}"</div></div>`);
  });

  return `<div class="stat-grid">${boxes.join("")}</div>`;
}

async function loadResponses(){
  const program = getProgram(ADMIN_PROGRAM_ID) || PROGRAMS[0];
  const keys = await slist('response:');
  const area = document.getElementById('responsesArea');
  if(!area) return;
  const results = await Promise.all(keys.map(k=> sget(k, null)));
  const responses = results.filter(r=> r && r.programId === (program ? program.id : null)).sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
  window.__responses = responses;

  if(!responses.length){
    area.innerHTML = `<div class="card"><p class="empty">لا توجد استجابات مسجّلة بعد لبرنامج «${esc(program?program.name:'')}».</p></div>`;
    return;
  }

  const cols = [
    ['name','الاسم'],
  ];
  if(program.fields.nationality) cols.push(['nationality','الجنسية']);
  if(program.fields.idNumber) cols.push(['idNumber','رقم البطاقة']);
  if(program.fields.birthdate){ cols.push(['birthdate','تاريخ الميلاد']); cols.push(['age','العمر']); }
  if(program.fields.studentPhone) cols.push(['studentPhone','جوال الطالب']);
  if(program.fields.guardianPhone) cols.push(['guardianPhone','جوال ولي الأمر']);
  if(program.fields.disease){ cols.push(['disease','يعاني من مرض']); cols.push(['diseaseDetail','تفاصيل المرض']); }
  program.customFields.forEach(cf=> cols.push(['custom__'+cf.id, cf.label]));
  cols.push(['submittedAt','تاريخ التسجيل']);

  area.innerHTML = `
    <div class="card">
      <div class="section-title">📊 إحصائية سريعة — ${esc(program.name)}</div>
      ${buildStatsHtml(program, responses)}
    </div>
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
      <div>
        <b style="font-family:'Cairo';color:var(--navy);font-size:16px;">استجابات: ${esc(program.name)}</b><br>
        <b style="font-family:'Cairo';color:var(--navy);">${responses.length}</b> <span style="color:var(--muted);font-size:13.5px;">طالبًا مسجّلاً</span>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="icon-btn" id="refreshResponsesBtn" title="مسح وتحديث">🧹🔄</button>
        <button class="btn secondary small" id="exportBtn">تصدير إلى إكسل 📊</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join("")}</tr></thead>
        <tbody>
          ${responses.map(r=>`<tr>${cols.map(c=>`<td>${esc(fmtCell(r[c[0]], c[0]))}</td>`).join("")}</tr>`).join("")}
        </tbody>
      </table>
    </div>`;

  document.getElementById('exportBtn').onclick = ()=> exportExcel(responses, cols, program);
  document.getElementById('refreshResponsesBtn').onclick = ()=>{ area.innerHTML = `<div class="card"><p class="empty">جارِ تحميل الاستجابات...</p></div>`; loadResponses(); };
}

function fmtCell(v, key){
  if(key==='submittedAt' && v){ try{ return new Date(v).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'}); }catch(e){ return v; } }
  return v==null ? "" : v;
}

function exportExcel(responses, cols, program){
  const header = cols.map(c=>c[1]);
  const rows = responses.map(r=> cols.map(c=> fmtCell(r[c[0]], c[0])));
  const data = [header, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = cols.map(c=> ({wch: Math.max(14, c[1].length+4)}));
  ws['!freeze'] = {xSplit:0, ySplit:1};
  const range = XLSX.utils.decode_range(ws['!ref']);
  ws['!autofilter'] = {ref: ws['!ref']};
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "الاستجابات");
  XLSX.writeFile(wb, `تسجيلات_${((program&&program.name)||'البرنامج').replace(/\s+/g,'_')}.xlsx`);
}

/* builds one workbook with a sheet per program — used for the once-a-day auto backup */
function exportBackupWorkbook(allResponses, filename){
  const wb = XLSX.utils.book_new();
  PROGRAMS.forEach(program=>{
    const responses = allResponses.filter(r=> r.programId === program.id);
    if(!responses.length) return;
    const cols = [['name','الاسم']];
    if(program.fields.nationality) cols.push(['nationality','الجنسية']);
    if(program.fields.idNumber) cols.push(['idNumber','رقم البطاقة']);
    if(program.fields.birthdate){ cols.push(['birthdate','تاريخ الميلاد']); cols.push(['age','العمر']); }
    if(program.fields.studentPhone) cols.push(['studentPhone','جوال الطالب']);
    if(program.fields.guardianPhone) cols.push(['guardianPhone','جوال ولي الأمر']);
    if(program.fields.disease){ cols.push(['disease','يعاني من مرض']); cols.push(['diseaseDetail','تفاصيل المرض']); }
    program.customFields.forEach(cf=> cols.push(['custom__'+cf.id, cf.label]));
    cols.push(['submittedAt','تاريخ التسجيل']);
    const header = cols.map(c=>c[1]);
    const rows = responses.map(r=> cols.map(c=> fmtCell(r[c[0]], c[0])));
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    ws['!cols'] = cols.map(c=> ({wch: Math.max(14, c[1].length+4)}));
    XLSX.utils.book_append_sheet(wb, ws, (program.name||'برنامج').slice(0,28).replace(/[\\/*?\[\]:]/g,'_'));
  });
  if(wb.SheetNames.length) XLSX.writeFile(wb, filename);
}
